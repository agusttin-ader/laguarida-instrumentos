<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión — La Guarida</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1c;
      color: #e8e8ec;
      padding: 1.5rem;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; font-weight: 600; }
    p { font-size: 0.9375rem; color: rgba(255,255,255,0.7); margin: 0 0 1.5rem; max-width: 280px; }
    button {
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #e08d00;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #e8990a; }
  </style>
</head>
<body>
  <h1>No hay conexión — Revisá tu red</h1>
  <p>Revisá tu red y volvé a intentar.</p>
  <button type="button" onclick="window.location.reload()">Reintentar</button>
</body>
</html>
